name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Production dependencies only. The dev tree carries a standing
      # advisory against braces, reachable solely through
      # eslint-config-next, with no patched version published and no path
      # from a visitor to it. Auditing everything would mean a permanently
      # red build, which teaches people to ignore the result. This fails
      # only when something that actually ships is affected.
      - run: npm audit --omit=dev --audit-level=high

      # format:check, lint, typecheck, check:copy, test
      - run: npm run verify

      # The build catches what unit tests cannot: bad route types, a server
      # component importing something it must not, a failed prerender.
      - run: npm run build
